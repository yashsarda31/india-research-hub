<header class="top">

      <ul id="ac" class="ac" role="listbox" hidden></ul>

    <nav class="nav">
      <a href="#/all">All reports</a>
      <a href="#/brokers">Brokers</a>
    </nav>
  </div>
</header>

<main id="view" class="wrap" tabindex="-1"></main>

</footer>
